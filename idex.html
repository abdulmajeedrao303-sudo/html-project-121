<script>
    function showImage(event) {
        let image = 
        document.getElementById("preview");
        let text = 
        document.getElementById("text");

        image.src =
        URL.createObjectURL(event.target.files[0]);
        image.style.display ="block";
        text.style.display ="none";
    }
</script>
